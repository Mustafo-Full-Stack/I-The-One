<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Game - С управлением</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e27;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .game-ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(26, 31, 58, 0.85);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid #2a3f5f;
      backdrop-filter: blur(4px);
    }

    .game-ui h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #e8edf5;
    }

    .controls {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #9cb4cc;
    }

    .controls strong {
      color: #4a7ba7;
    }

    .model-selector {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(26, 31, 58, 0.95);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid #2a3f5f;
      backdrop-filter: blur(4px);
      max-width: 300px;
    }

    .model-selector h3 {
      font-size: 0.95rem;
      margin-bottom: 1rem;
      color: #e8edf5;
    }

    .model-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 0.5rem;
      background: #2a3f5f;
      border: 1px solid #3d5a7d;
      border-radius: 4px;
      color: #e8edf5;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      text-align: left;
    }

    .model-btn:hover {
      background: #3d5a7d;
      border-color: #4a7ba7;
    }

    .model-btn.active {
      background: #4a7ba7;
      border-color: #5a8fb7;
    }

    .model-input {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.8rem;
      background: rgba(42, 63, 95, 0.5);
      border: 1px solid #2a3f5f;
      border-radius: 4px;
      color: #e8edf5;
      font-size: 0.85rem;
    }

    .model-input::placeholder {
      color: #5a7fa5;
    }

    @media (max-width: 768px) {
      .game-ui {
        top: 10px;
        left: 10px;
        padding: 1rem;
        font-size: 0.9rem;
      }

      .model-selector {
        bottom: 10px;
        right: 10px;
        padding: 1rem;
        max-width: 250px;
      }

      .model-btn {
        padding: 0.6rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div class="game-ui">
    <h3>Управление</h3>
    <div class="controls">
      <div><strong>W/↑</strong> — Вперёд</div>
      <div><strong>S/↓</strong> — Назад</div>
      <div><strong>A/←</strong> — Влево</div>
      <div><strong>D/→</strong> — Вправо</div>
      <div><strong>SPACE</strong> — Прыжок</div>
    </div>
  </div>

  <div class="model-selector">
    <h3>Загрузить модель</h3>
    <button class="model-btn active" data-model="default">Встроенный персонаж</button>
    <button class="model-btn" data-model="https://gobkit.com/api/free">Gobkit (API)</button>
    <input type="text" class="model-input" id="model-url" placeholder="Или введите URL модели GLB...">
    <button class="model-btn" id="load-custom">Загрузить</button>
  </div>

  <script>
    let threeLoaded = false
    const checkThree = setInterval(() => {
      if (typeof THREE !== 'undefined') {
        threeLoaded = true
        clearInterval(checkThree)
        initGame()
      }
    }, 100)

    setTimeout(() => {
      if (!threeLoaded) {
        console.error('Three.js не загрузилась')
      }
    }, 5000)

    function initGame() {
      const canvas = document.getElementById('game-canvas')

      // Renderer
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.setPixelRatio(window.devicePixelRatio)
      renderer.shadowMap.enabled = true
      renderer.shadowMap.type = THREE.PCFSoftShadowMap

      // Scene
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x1a2332)
      scene.fog = new THREE.Fog(0x1a2332, 40, 80)

      // Camera
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000)
      camera.position.set(25, 18, 25)
      camera.lookAt(0, 2, 0)

      // Lighting
      const mainLight = new THREE.DirectionalLight(0xffffff, 0.8)
      mainLight.position.set(20, 30, 15)
      mainLight.castShadow = true
      mainLight.shadow.mapSize.width = 2048
      mainLight.shadow.mapSize.height = 2048
      mainLight.shadow.camera.left = -50
      mainLight.shadow.camera.right = 50
      mainLight.shadow.camera.top = 50
      mainLight.shadow.camera.bottom = -50
      mainLight.shadow.camera.near = 0.5
      mainLight.shadow.camera.far = 100
      mainLight.shadow.bias = -0.0001
      scene.add(mainLight)

      const ambientLight = new THREE.AmbientLight(0x8fa5b8, 0.4)
      scene.add(ambientLight)

      const hemisphereLight = new THREE.HemisphereLight(0x87a7c4, 0x1e2a38, 0.5)
      scene.add(hemisphereLight)

      // Арена
      const floorGeometry = new THREE.PlaneGeometry(40, 40)
      const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x2d4059, metalness: 0.1, roughness: 0.7 })
      const floor = new THREE.Mesh(floorGeometry, floorMaterial)
      floor.rotation.x = -Math.PI / 2
      floor.receiveShadow = true
      scene.add(floor)

      const innerFloorGeometry = new THREE.PlaneGeometry(30, 30)
      const innerFloorMaterial = new THREE.MeshStandardMaterial({ color: 0x37475a, metalness: 0.15, roughness: 0.6 })
      const innerFloor = new THREE.Mesh(innerFloorGeometry, innerFloorMaterial)
      innerFloor.rotation.x = -Math.PI / 2
      innerFloor.position.y = 0.05
      innerFloor.receiveShadow = true
      scene.add(innerFloor)

      // Бортики и столбы
      const borderMaterial = new THREE.MeshStandardMaterial({ color: 0x1e2a38, metalness: 0.4, roughness: 0.6 })
      const borderGeometry = new THREE.BoxGeometry(40, 1.5, 0.8)
      const frontBorder = new THREE.Mesh(borderGeometry, borderMaterial)
      frontBorder.position.set(0, 0.75, -20)
      frontBorder.castShadow = true
      scene.add(frontBorder)

      const backBorder = frontBorder.clone()
      backBorder.position.z = 20
      scene.add(backBorder)

      const pillarGeometry = new THREE.CylinderGeometry(0.5, 0.5, 4, 8)
      const pillarMaterial = new THREE.MeshStandardMaterial({ color: 0x4a7ba7, metalness: 0.6, roughness: 0.3 })
      const pillarPositions = [
        { x: -20, z: -20 },
        { x: 20, z: -20 },
        { x: -20, z: 20 },
        { x: 20, z: 20 }
      ]

      pillarPositions.forEach(pos => {
        const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial)
        pillar.position.set(pos.x, 2, pos.z)
        pillar.castShadow = true
        scene.add(pillar)
      })

      // Персонаж
      const playerGroup = new THREE.Group()
      scene.add(playerGroup)

      let playerParts = {}

      function createDefaultPlayer() {
        playerGroup.clear()

        const headGeometry = new THREE.SphereGeometry(1.2, 32, 32)
        const headMaterial = new THREE.MeshStandardMaterial({ color: 0xf5a57a, metalness: 0.1, roughness: 0.8 })
        const head = new THREE.Mesh(headGeometry, headMaterial)
        head.position.y = 4.2
        head.castShadow = true
        playerGroup.add(head)

        const bodyGeometry = new THREE.BoxGeometry(2, 3, 1.2)
        const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x4a7ba7, metalness: 0.2, roughness: 0.7 })
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial)
        body.position.y = 2.2
        body.castShadow = true
        playerGroup.add(body)

        const armGeometry = new THREE.BoxGeometry(0.6, 2.5, 0.6)
        const armMaterial = new THREE.MeshStandardMaterial({ color: 0x5a8fb7, metalness: 0.15, roughness: 0.8 })
        const leftArm = new THREE.Mesh(armGeometry, armMaterial)
        leftArm.position.set(-1.5, 2.5, 0)
        leftArm.castShadow = true
        playerGroup.add(leftArm)

        const rightArm = leftArm.clone()
        rightArm.position.x = 1.5
        playerGroup.add(rightArm)

        const legGeometry = new THREE.BoxGeometry(0.7, 2.5, 0.7)
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x37475a, metalness: 0.2, roughness: 0.75 })
        const leftLeg = new THREE.Mesh(legGeometry, legMaterial)
        leftLeg.position.set(-0.6, 0.2, 0)
        leftLeg.castShadow = true
        playerGroup.add(leftLeg)

        const rightLeg = leftLeg.clone()
        rightLeg.position.x = 0.6
        playerGroup.add(rightLeg)

        const shadowGeometry = new THREE.CircleGeometry(1.5, 32)
        const shadowMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 })
        const shadow = new THREE.Mesh(shadowGeometry, shadowMaterial)
        shadow.rotation.x = -Math.PI / 2
        shadow.position.y = 0.01
        playerGroup.add(shadow)

        playerParts = { head, body, leftArm, rightArm, leftLeg, rightLeg }
      }

      createDefaultPlayer()

      // Управление
      const keys = {}
      const position = new THREE.Vector3(0, 0, 0)
      const velocity = new THREE.Vector3(0, 0, 0)
      let isJumping = false

      window.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true
      })
      window.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false
      })

      let animationTime = 0

      // Обработчики моделей
      document.querySelectorAll('.model-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'))
          btn.classList.add('active')

          if (btn.dataset.model === 'default') {
            createDefaultPlayer()
          }
        })
      })

      document.getElementById('load-custom').addEventListener('click', () => {
        const url = document.getElementById('model-url').value
        if (url) {
          const loader = new THREE.GLTFLoader()
          loader.load(url, (gltf) => {
            playerGroup.clear()
            gltf.scene.traverse(node => {
              if (node.isMesh) {
                node.castShadow = true
                node.receiveShadow = true
              }
            })
            playerGroup.add(gltf.scene)
            console.log('Модель загружена успешно!')
          })
        }
      })

      // Анимационный цикл
      const clock = new THREE.Clock()

      function animate() {
        requestAnimationFrame(animate)

        const deltaTime = clock.getDelta()

        // Движение
        const direction = new THREE.Vector3()
        if (keys['w'] || keys['arrowup']) direction.z -= 1
        if (keys['s'] || keys['arrowdown']) direction.z += 1
        if (keys['a'] || keys['arrowleft']) direction.x -= 1
        if (keys['d'] || keys['arrowright']) direction.x += 1

        if (direction.length() > 0) {
          direction.normalize()
          position.x += direction.x * 0.3
          position.z += direction.z * 0.3

          const angle = Math.atan2(direction.x, direction.z)
          playerGroup.rotation.y = angle
        }

        // Прыжок
        if ((keys[' '] || keys['space']) && !isJumping) {
          velocity.y = 0.5
          isJumping = true
        }

        velocity.y -= 0.02
        position.y += velocity.y

        if (position.y <= 0) {
          position.y = 0
          velocity.y = 0
          isJumping = false
        }

        // Ограничение области
        const limit = 20
        position.x = Math.max(-limit, Math.min(limit, position.x))
        position.z = Math.max(-limit, Math.min(limit, position.z))

        playerGroup.position.copy(position)

        // Анимация встроенного персонажа
        if (playerParts.body) {
          animationTime += 0.015
          playerParts.body.rotation.y = Math.sin(animationTime * 0.8) * 0.05
          playerParts.body.position.y = 2.2 + Math.sin(animationTime) * 0.05
          playerParts.head.rotation.y = Math.sin(animationTime * 0.6) * 0.1
          playerParts.leftArm.rotation.z = Math.sin(animationTime * 0.7) * 0.15
          playerParts.rightArm.rotation.z = Math.cos(animationTime * 0.7) * 0.15
          playerParts.leftLeg.rotation.x = Math.sin(animationTime * 0.5) * 0.08
          playerParts.rightLeg.rotation.x = Math.cos(animationTime * 0.5) * 0.08
        }

        // Обновление камеры за персонажем
        const offset = 25
        camera.position.x = position.x + offset
        camera.position.z = position.z + offset
        camera.lookAt(position.x, position.y + 2, position.z)

        renderer.render(scene, camera)
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      animate()
    }
  </script>
</body>
</html>
